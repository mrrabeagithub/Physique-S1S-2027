<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physique S1S — 2026-2027</title>
  <meta name="description" content="Ressources de physique pour la classe S1S — année scolaire 2026-2027.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --accent: #2457d6;
      --border: #e4e7ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #7aa2ff;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 32px 18px 48px; }
    header {
      padding: 34px 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      margin-bottom: 28px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.1rem); }
    header p { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .eyebrow {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: .82rem;
    }
    h2 { margin: 8px 0 8px; font-size: 1.35rem; }
    .card p { margin: 0; color: var(--muted); }
    footer { margin-top: 34px; color: var(--muted); font-size: .92rem; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Ressources pédagogiques</div>
      <h1>Physique S1S — 2026-2027</h1>
      <p>Cours, exercices, simulations et infographiques destinés aux élèves de S1S.</p>
    </header>

    <section class="grid" aria-label="Chapitres">
      <a class="card" href="./Chapitre%202%3A%20Tension%20%C3%A9lectrique/">
        <div class="eyebrow">Chapitre 2</div>
        <h2>Tension électrique</h2>
        <p>Accéder aux ressources du chapitre.</p>
      </a>
    </section>

    <footer>
      Physique S1S • Année scolaire 2026-2027
    </footer>
  </main>
</body>
</html>
